<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration For Labolatory Use (Pra PSTS)</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-blue-200">

    <!-- Header -->
    <header class="bg-blue-400 p-6 text-center text-white">
        <h1 class="text-3xl font-bold">Registration Labolatory</h1>
        <p class="mt-2">SMA ABBS Surakarta</p>
    </header>

    <!-- Main -->
    <main class="mx-auto my-8 max-w-2xl px-4">

        <div class="rounded-xl bg-white p-6 shadow-md">

            <h2 class="mb-6 text-center text-2xl font-bold text-blue-400">Labolatory Loan Registration Form</h2>

            <div class="space-y-5">

                <!-- Borrower's Name -->
                <div>
                    <label class="mb-1 block font-semibold">Borrower's Name</label>
                    <input type="text"
                        placeholder="Enter Your Name"
                        class="w-full rounded-lg border border-blue-400 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <!-- Status -->
                <div>
                    <label class="mb-2 block font-semibold">Status</label>

                    <div class="flex flex-wrap gap-5">
                        <label>
                            <input type="radio" name="status">Teacher
                        </label>

                        <label>
                            <input type="radio" name="status">Student
                        </label>

                        <label>
                            <input type="radio" name="status">Organization
                        </label>
                    </div>
                </div>

                <!-- Purpose -->
                <div>
                    <label class="mb-1 block font-semibold">Purpose</label>
                    <input type="text"
                        placeholder="Practicum, Practice, OSIS Meeting, etc."
                        class="w-full rounded-lg border border-blue-400 p-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <!-- Borrowed Lab -->
                <div>
                    <label class="mb-1 block font-semibold">Borrowed Lab</label>

                    <select class="w-full rounded-lg border border-blue-400 p-3">
                        <option>Choose a labolatory</option>
                        <option>Lab 1 (Software)</option>
                        <option>Lab 2 (Hardware)</option>
                    </select>
                </div>

                <!-- Date -->
                <div>
                    <label class="mb-1 block font-semibold">Date of Use</label>
                    <input type="date"
                        class="w-full rounded-lg border border-blue-400 p-3">
                </div>

                <!-- Time -->
                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label class="mb-1 block font-semibold">Start Time</label>
                        <input type="time"
                            class="w-full rounded-lg border border-blue-400 p-3">
                    </div>

                    <div>
                        <label class="mb-1 block font-semibold">End Time</label>
                        <input type="time"
                            class="w-full rounded-lg border border-blue-400 p-3">
                    </div>
                </div>

                <!-- Participants -->
                <div>
                    <label class="mb-1 block font-semibold">Number of Participants</label>
                    <input type="number"
                        placeholder="Example: 30"
                        class="w-full rounded-lg border border-blue-500 p-3">
                </div>

                <!-- Special Requirements -->
                <div>
                    <label class="mb-1 block font-semibold">Special Requirements</label>
                    <textarea rows="4"
                        placeholder="Need internet access, need a projector, etc."
                        class="w-full rounded-lg border border-blue-400 p-3"></textarea>
                </div>

                <!-- Button -->
                 <div>
                    <button type="submit"
                        class="w-full rounded-lg bg-blue-400 p-3 font-bold text-white hover:bg-blue-800">Submit Registration</button>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-blue-400 p-4 text-center text-sm text-white">
        Registration Labolatory System © 2026
        (Pra PSTS)
    </footer>

</body>
</html>
