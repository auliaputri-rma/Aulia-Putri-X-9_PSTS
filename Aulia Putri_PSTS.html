<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Event</title>

    <!-- Tailwind CSS CDN -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-150">

    <!-- Header -->
     <header class="bg-blue-500 p-5 text-center text-white">
        <h1 class="text-1xl font-bold">ICT Student Website Exhibition Festival</h1><br>
        <p class="mt-4">The Creativity of SMA ABBS Surakarta Students</p>
     </header>

     <!-- Main -->
     <main class="mx-auto my-8 max-w-2xl px-4">

        <div class="rounded-x1 bg-white p-6 shadow-md">

            <h1 class="mb-6 text-center text-1xl font-bold text-blue-300"></h1>

            <div class="space-y-5">

                <!-- Borrower's Name -->
                <div>
                     <label class="mb-1 block font-semibold">Registration Form</label>
                     <input type="text"
                          placeholder="Enter Your Full Name"
                          class="w-full rounded-lgborder border-blue-500 p-3 focus:uotline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Class -->
              
                <label class="mb-2 block font-semibold">Class</label>
                <select>
                    <option>X</option>
                    <option>XI</option>
                    <option>XII</option>
                </select>
                
                <!-- Gender -->
                <div>
                    <label class="mb-3 block font-semibold">Gender</label>

                    <div class="flex flex-wrap gap-5">
                        <label>
                            <input type="radio" name="gender">Male
                        </label>

                        <label>
                            <input type="radio" name="gender">Female
                        </label>
                    </div>
                         
                </div>

                <!-- Type of Web-->
                <div>
                    <label class="mb-1 block font-semibold">Type of Web</label>

                    <input type="checkbox">Web Development
                    <input type="checkbox">IoT Project
                    <input type="checkbox">PWKU
                  </div>
                <!-- Participation Type -->
                
                    <label class="mb-3 block font-semibold">Participation Type</label>

                    <div class="flex flex-wrap gap-5">
                        <label>
                            <input type="radio" name="Participation Type">Team
                        </label>

                        <label>
                            <input type="radio" name="Participation Type">Individual
                        </label>
                    </div>

                <!-- Team Name -->
                <div>
                    <label class="mb-1 block font-semibold">Team Name</label>
                     <input type="text"
                      placeholder="Enter Your Team Name"
                      class="w-full rounded-lgborder border-blue-500 p-3 focus:uotline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Contat Number -->
                <div>
                     <label class="mb-1 block font-semibold">Contat Name</label>
                     <input type="number"
                           placeholder="08xxxxxxxxxx"
                           class="w-full rounded-lgborder border-blue-500 p-3 focus:uotline-none focus:ring-2 focus:ring-blue-500">
                </div>
                

                    <!-- Project Description -->
                    <div>
                        <label class="mb-1 block font-semibold"></label>
                        <textarea rows="4"
                              placeholder="Need internet access, need a projector, etc."
                              class="w-full rounded-lg border border-blue-400 p-3"></textarea>
                    </div>
                    
                    <!-- Button -->
                    <div>
                        <button type="submit"
                             class="w-full rounded-lg bg-blue-400 p-3 font-bold text-white hover:bg-blue-800">Register Now</button>
                    </div>
                </form>
                     

              </div>
            </form>


        </div>
     </main>
    
</body>
</html>
